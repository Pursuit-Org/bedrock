name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Checkout-and-test only — scope the default token down from write.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financial_forecasting/frontend-v2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: financial_forecasting/frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financial_forecasting

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: financial_forecasting/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        # The Jobs and awards tests run on a fake pool (tests/jobs_fakes.py)
        # since 2026-08-18, so they no longer need a live database.
        run: python -m pytest
        env:
          JWT_SECRET_KEY: ci-test-secret-not-for-production
          DATABASE_URL: ""
          FRONTEND_URL: http://localhost:4200
